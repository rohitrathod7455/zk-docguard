services:
  - type: web
    name: zk-docguard-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm turbo run build --filter=@zk-docguard/api && pnpm --filter @zk-docguard/api exec prisma db push && pnpm seed
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prod.db
      - key: API_PORT
        value: 10000
      - key: API_HOST
        value: 0.0.0.0
      - key: LOCAL_RPC_URL
        value: https://rpc-amoy.polygon.technology
      - key: SESSION_SECRET
        generateValue: true
